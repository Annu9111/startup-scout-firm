<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup Scout Firm</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#e3e0d8; --accent:#e8590c; --ok:#2b8a3e; --bad:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:8px 0 4px; font-size:14px; }
  input[type=text], input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  .rounds label { display:inline-block; font-weight:400; margin-right:14px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.ok { background: var(--ok); } button.bad { background: var(--bad); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#eee; }
  .badge.approved { background:#d3f9d8; color:var(--ok); }
  .badge.rejected { background:#ffe3e3; color:var(--bad); }
  .badge.needs_human_review { background:#fff3bf; color:#8a5a00; }
  .log { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); white-space: pre-wrap; margin:8px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .error { color: var(--bad); font-weight: 600; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Startup Scout Firm</h1>
  <p class="sub">An AI research firm. Tell us what to look for; agents research it; a human approves every brief before delivery.</p>

  <div class="card">
    <label for="customer">Customer name</label>
    <input type="text" id="customer" value="Demo Customer">
    <label>Funding stages</label>
    <div class="rounds">
      <label><input type="checkbox" value="seed" checked> Seed</label>
      <label><input type="checkbox" value="series_a" checked> Series A</label>
      <label><input type="checkbox" value="series_b" checked> Series B</label>
    </div>
    <label for="since">Funded since</label>
    <input type="text" id="since" value="2026-09-01">
    <label for="limit">Number of startups (1 to 10)</label>
    <input type="number" id="limit" value="3" min="1" max="10">
    <div class="row"><button id="startBtn">Start research job</button></div>
    <div id="formError" class="error"></div>
  </div>

  <div id="jobCard" class="card" hidden>
    <div><strong>Job <span id="jobId"></span></strong> <span id="jobStatus" class="badge"></span></div>
    <div id="jobTime" class="meta"></div>
    <div id="jobLog" class="log"></div>
  </div>

  <div id="briefs"></div>
  <div id="reportCard" class="card" hidden></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null;
let timer = null;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "text") node.textContent = v;
    else if (k === "class") node.className = v;
    else node[k] = v;
  });
  children.forEach((c) => node.appendChild(c));
  return node;
}

async function api(path, options) {
  const r = await fetch(path, options);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function startJob() {
  $("formError").textContent = "";
  const rounds = [...document.querySelectorAll(".rounds input:checked")].map((i) => i.value);
  if (rounds.length === 0) { $("formError").textContent = "Pick at least one funding stage."; return; }
  try {
    $("startBtn").disabled = true;
    const res = await api("/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        customer: $("customer").value || "Customer",
        rounds,
        since: $("since").value,
        limit: Number($("limit").value),
      }),
    });
    jobId = res.job_id;
    $("briefs").innerHTML = "";
    $("reportCard").hidden = true;
    poll();
  } catch (e) {
    $("formError").textContent = e.message;
  } finally {
    $("startBtn").disabled = false;
  }
}

async function poll() {
  clearTimeout(timer);
  const job = await api("/jobs/" + jobId);
  render(job);
  if (job.status === "queued" || job.status === "running") {
    timer = setTimeout(poll, 3000);
  }
}

function render(job) {
  $("jobCard").hidden = false;
  $("jobId").textContent = job.id;
  $("jobStatus").textContent = job.status;
  $("jobStatus").className = "badge " + job.status;
  $("jobTime").textContent = job.seconds_taken ? "Research took " + job.seconds_taken + " seconds" : "";
  $("jobLog").textContent = (job.log || []).join("\n") + (job.error ? "\nERROR: " + job.error : "");

  if (job.status === "queued" || job.status === "running") return;

  const box = $("briefs");
  box.innerHTML = "";
  job.briefs.forEach((b, i) => {
    const f = b.funding || {};
    const link = el("a", { text: b.website, href: "https://" + b.website, target: "_blank", rel: "noopener noreferrer" });
    const meta = el("div", { class: "meta" }, [link]);
    meta.append(" · " + (f.last_round_type || "?") + " · $" + (f.last_round_amount_usd || "?") + " · " + (f.last_fundraise_date || "?") + " · team " + (b.headcount ?? "?"));
    const area = el("textarea", { value: b.brief });
    const decided = b.status !== "needs_human_review";
    area.disabled = decided;
    const approve = el("button", { class: "ok", text: "Approve", disabled: decided });
    const reject = el("button", { class: "bad", text: "Reject", disabled: decided });
    approve.onclick = () => decide(i, "approve", area.value, b.brief);
    reject.onclick = () => decide(i, "reject", null, b.brief);
    const card = el("div", { class: "card" }, [
      el("div", {}, [el("strong", { text: b.name + " " }), el("span", { class: "badge " + b.status, text: b.status })]),
      meta, area, el("div", { class: "row" }, [approve, reject]),
    ]);
    box.appendChild(card);
  });

  if (job.skipped && job.skipped.length) {
    const lines = job.skipped.map((s) => "Skipped " + s.name + ": " + s.reason).join("\n");
    box.appendChild(el("div", { class: "card" }, [el("div", { class: "log", text: lines })]));
  }
  if (job.status === "completed") showReport();
}

async function decide(index, action, text, original) {
  const body = { action };
  if (text && text !== original) body.edited_brief = text;
  try {
    await api(`/jobs/${jobId}/briefs/${index}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    poll();
  } catch (e) {
    alert(e.message);
  }
}

async function showReport() {
  const rep = await api("/jobs/" + jobId + "/report");
  const card = $("reportCard");
  card.innerHTML = "";
  card.hidden = false;
  card.appendChild(el("h2", { text: "Final report for " + rep.customer }));
  card.appendChild(el("div", { class: "meta", text: rep.approved.length + " approved · " + rep.rejected_count + " rejected · " + rep.skipped.length + " skipped by data checks" }));
  rep.approved.forEach((b) => {
    card.appendChild(el("h3", { text: b.name + " (" + b.website + ")" }));
    card.appendChild(el("p", { text: b.brief }));
  });
}

$("startBtn").onclick = startJob;
</script>
</body>
</html>
